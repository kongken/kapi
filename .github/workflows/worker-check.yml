name: Worker checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/worker-check.yml"
      - "workers/szx-collector/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/worker-check.yml"
      - "workers/szx-collector/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/szx-collector

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/szx-collector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check collector
        run: npm run check

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/kapi-szx-worker
